<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Replenishment Summary - Inventory App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h1>Monthly Replenishment Summary</h1>
            <div id="user-info">
                <span id="display-name"></span>
                <button id="logout-btn" style="background-color: #6c757d; color: white; padding: 5px 10px; margin-left: 10px;">Logout</button>
            </div>
        </div>

        <nav>
            <a href="index.html">Inventory</a> |
            <a href="summary.html">Replenishment Summary</a>
        </nav>

        <div class="summary-content">
            <p>This report shows the monthly contribution of each person to overall stock replenishment on the kiosk from the store room.</p>
            <table>
                <thead>
                    <tr>
                        <th>Month</th>
                        <th>Person</th>
                        <th>Total Quantity Added</th>
                        <th>Items Replenished</th>
                    </tr>
                </thead>
                <tbody id="summary-tbody">
                    <!-- Summary data will be loaded here -->
                </tbody>
            </table>
        </div>
    </div>
    <script src="summary.js"></script>
</body>
</html>
